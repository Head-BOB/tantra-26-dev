<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Organiser Login · Tantra 26</title>
<meta name="description" content="Event Coordinator and Organiser Portal for Tantra 26. Enter your 6-digit event access code to manage participants.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--cream:#efe8da;--ink:#141414;--red:#c23b22;--gold:#e3a72f;--green:#2b6a4d;--navy:#101a2d;box-sizing:border-box}
*{margin:0;padding:0;box-sizing:inherit}
html,body{height:100%}
body{background:#0a0e1c;color:var(--cream);font-family:'Inter',system-ui,sans-serif;overflow:hidden}
[hidden]{display:none!important}
h2{font-family:'Anton',Impact,'Arial Narrow Bold',sans-serif;font-weight:400;text-transform:uppercase}
#sky{position:fixed;inset:0;width:100%;height:100%}

/* intro: four colour slabs sweep away */
.wipe{position:fixed;inset:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);pointer-events:none}
.wipe i{background:var(--c);transform-origin:top;animation:wipe .9s cubic-bezier(.7,0,.2,1) both;animation-delay:calc(var(--i)*.1s + .15s)}
@keyframes wipe{to{transform:scaleY(0)}}

.back{position:fixed;top:20px;left:max(5vw,20px);z-index:5;font:700 12px/1 'Inter';letter-spacing:.24em;text-transform:uppercase;background:#000;color:var(--cream);padding:13px 20px;text-decoration:none;clip-path:polygon(2% 8%,100% 0,97% 92%,0 100%);transition:background .3s,color .3s}
.back:hover{background:var(--gold);color:var(--ink)}

.page{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(22px,5vh,44px);padding:20px}
.logo{width:min(70vw,360px);animation:rise 1.1s 1s cubic-bezier(.16,1,.3,1) both}
.logo svg{width:100%;height:auto;display:block;animation:float 6s ease-in-out infinite}
.logo-let{opacity:1}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes rise{from{opacity:0;transform:translateY(30px)}}

.card{width:min(100%,380px);background:var(--cream);color:var(--ink);border:3px solid var(--ink);border-radius:14px;box-shadow:8px 8px 0 var(--gold);padding:28px 26px;display:grid;gap:16px;text-align:center;animation:rise 1.1s 1.15s cubic-bezier(.16,1,.3,1) both}
.card.shake{animation:shake .5s}
@keyframes shake{20%{translate:-12px}40%{translate:10px}60%{translate:-7px}80%{translate:4px}}
.sub{font:700 10px/1 'Inter';letter-spacing:.3em;text-transform:uppercase;color:var(--red);margin-bottom:8px}
h2{font-size:2rem;line-height:1}
.f{position:relative;display:block}
input{width:100%;font:400 1.5rem/1 'Anton',Impact,monospace;letter-spacing:.3em;text-align:center;padding:16px 64px 14px 16px;border:2px solid var(--ink);border-radius:6px;background:#fff;color:var(--ink);text-transform:uppercase;transition:box-shadow .2s}
input:focus{outline:none;box-shadow:4px 4px 0 var(--gold)}
.eye{position:absolute;right:6px;top:50%;translate:0 -50%;border:0;background:var(--ink);color:var(--cream);font:700 10px/1 'Inter';letter-spacing:.14em;text-transform:uppercase;padding:9px 10px;cursor:pointer;clip-path:polygon(6% 0,100% 8%,94% 100%,0 92%)}
.err{color:var(--red);font:600 13px/1.4 'Inter';min-height:1.4em}
.go{position:relative;overflow:hidden;border:0;cursor:pointer;font:700 13px/1 'Inter';letter-spacing:.24em;text-transform:uppercase;background:var(--ink);color:var(--cream);padding:18px;clip-path:polygon(2% 0,100% 6%,98% 100%,0 94%);transition:background .3s,color .3s;text-decoration:none;display:block}
.go:hover{background:var(--gold);color:var(--ink)}.go:disabled{opacity:.6;cursor:wait}
.go::after{content:"";position:absolute;top:0;bottom:0;width:60px;left:-80px;background:rgba(239,232,218,.35);transform:skewX(-20deg)}
.go.busy::after{animation:sweep .8s linear infinite}
@keyframes sweep{to{left:110%}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.wipe{display:none}}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="wipe" aria-hidden="true"><i style="--i:0;--c:#c23b22"></i><i style="--i:1;--c:#e3a72f"></i><i style="--i:2;--c:#2b6a4d"></i><i style="--i:3;--c:#182338"></i></div>

<a class="back" href="/">&larr; Tantra 26</a>

<main class="page">
  <div class="logo" aria-label="Tantra 26">
    <svg viewBox="0 0 669 262" xmlns="http://www.w3.org/2000/svg" aria-label="TANTRA">
      <g transform="translate(0, 207) scale(1, -1)" fill="var(--cream)">
        <g class="logo-let" id="let-t1"><path d="M196 196 c-59 -1 -119 -3 -154 -6 -35 -2 -36 -2 -8 -4 26 -1 58 -4 78 -7 16 -2 34 -5 35 -5 0 -1 -4 -6 -9 -13 -5 -7 -22 -36 -39 -63 -17 -28 -35 -59 -41 -68 -6 -10 -11 -19 -12 -19 -1 -3 18 17 56 58 35 38 37 40 48 58 l10 18 7 4 c22 13 46 24 89 40 10 3 18 7 20 7 1 1 -50 1 -80 0z M251 182 c-22 -8 -35 -14 -47 -21 -8 -5 -14 -9 -14 -9 1 0 7 3 15 6 7 3 14 6 14 6 2 0 39 19 41 21 1 1 -3 0 -9 -3z M70 178 c0 0 6 -1 13 -3 14 -3 39 -11 40 -13 0 0 -6 -14 -14 -30 -8 -16 -15 -29 -15 -29 1 0 40 62 40 63 0 2 -26 8 -42 10 -11 2 -24 3 -22 2z" /></g>
        <g class="logo-let" id="let-a1"><path d="M177 109 c-22 -22 -40 -41 -39 -41 0 0 14 7 31 17 28 15 33 18 40 24 4 4 8 7 8 7 1 0 21 -28 21 -29 0 -1 -2 -1 -4 -1 -4 0 -2 -1 20 -10 13 -5 24 -10 24 -10 1 0 1 1 0 2 -1 3 -24 34 -41 57 -16 22 -18 25 -19 25 0 0 -19 -18 -41 -41z" /></g>
        <g class="logo-let" id="let-n"><path d="M384 153 c-3 -5 -21 -33 -32 -52 -5 -8 -9 -14 -9 -14 -1 1 -30 25 -60 49 l-18 16 -1 -26 0 -26 4 -6 c3 -4 6 -8 8 -10 l3 -4 0 17 c0 11 0 18 1 18 1 0 2 -1 4 -3 7 -6 64 -52 66 -53 0 -1 9 12 19 28 l18 29 0 20 0 21 -3 -4z" /></g>
        <g class="logo-let" id="let-t2"><path d="M353 171 c-22 0 -56 -2 -56 -3 0 0 4 -1 9 -1 9 -1 14 -2 38 -5 24 -3 41 -5 42 -5 0 -1 -3 -6 -7 -12 -3 -6 -13 -21 -21 -34 -8 -13 -14 -24 -15 -24 0 0 -1 0 -2 1 -1 1 -2 2 -2 2 -1 0 -1 -5 -1 -11 l0 -11 6 -5 c4 -3 7 -5 7 -4 0 0 8 13 18 28 9 14 22 34 27 44 l11 17 10 0 c5 1 15 1 22 1 l12 0 8 10 c5 6 9 11 9 12 1 1 -10 1 -53 1 -30 0 -58 -1 -62 -1z M346 153 c13 -3 21 -6 21 -7 0 0 -5 -10 -11 -22 -5 -12 -10 -21 -9 -20 3 3 29 45 29 46 0 1 -4 2 -17 3 -25 3 -26 3 -13 0z" /></g>
        <g class="logo-let" id="let-r"><path d="M468 161 c-5 -5 -9 -11 -9 -11 0 -1 14 -1 32 -1 23 0 32 0 33 -1 2 -2 1 -5 -2 -7 -2 -2 -3 -2 -35 -2 l-34 0 -13 -26 c-22 -44 -23 -46 -20 -43 2 1 12 13 24 26 12 12 22 23 22 23 0 0 7 -8 15 -19 l15 -18 26 -17 c14 -10 26 -17 27 -18 2 0 0 1 -32 43 l-23 30 14 0 c19 1 24 3 33 11 11 12 14 28 5 36 -6 5 -8 5 -40 5 l-29 0 -9 -11z" /></g>
        <g class="logo-let" id="let-a2"><path d="M586 157 c-14 -19 -29 -36 -45 -53 -7 -8 -13 -15 -13 -15 0 -1 7 -9 8 -10 1 0 36 28 47 37 4 4 8 7 8 7 1 0 18 -32 20 -35 0 -2 0 -2 -9 -2 -7 1 -8 1 -6 0 17 -8 29 -15 44 -23 10 -6 18 -10 19 -10 0 1 -2 5 -4 9 -8 14 -17 32 -25 46 -4 7 -13 24 -20 38 -7 13 -13 25 -13 25 0 0 -5 -7 -11 -14z" /></g>
      </g>
      <g id="logo26" fill="var(--cream)" opacity="1">
        <g transform="translate(468 168) scale(.98) skewX(-9)">
          <path d="M2 30 L22 8 L48 0 L70 6 L66 28 L30 56 L74 52 L68 84 L0 88 L6 68 L44 38 L44 28 L30 26 L14 38Z"/>
        </g>
        <g transform="translate(556 168) scale(.98) skewX(-9)">
          <path fill-rule="evenodd" d="M72 0 L44 16 L22 40 L6 74 L30 90 L62 82 L76 52 L52 34 L32 40 L48 20Z M32 62 L34 74 L52 70 L54 56Z"/>
        </g>
      </g>
    </svg>
  </div>

  <div class="card" id="card">
    <div id="formwrap" style="display:grid;gap:16px">
      <div>
        <p class="sub">Organisers only</p>
        <h2>Enter passcode</h2>
      </div>
      <form id="form" novalidate style="display:grid;gap:14px">
        <span class="f">
          <input id="pw" type="text" maxlength="6" autocomplete="off" aria-label="Passcode" placeholder="••••••" spellcheck="false">
          <button type="button" class="eye" id="eye">Clear</button>
        </span>
        <p class="err" id="err" role="alert"></p>
        <button class="go" id="go" type="submit">Enter</button>
      </form>
    </div>
  </div>
</main>

<script type="module" src="/src/js/organisers-login.js"></script>
</body>
</html>
